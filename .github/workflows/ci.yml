name: CI

# Tests only — no deploy step. Docker productionizing + Render deployment
# were deliberately dropped from scope; this workflow's job is just "does
# the test suite still pass on push/PR."

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # -k "not live" excludes tests that need real API keys / real
        # network calls (Groq, Tavily, DuckDuckGo, Ollama) -- those are
        # manual live checks, not something CI can run without
        # secrets and a stable network dependency. Every non-live test
        # runs against fakes/local subprocesses only, matching this
        # project's own established test-splitting convention.
        run: pytest -k "not live" -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
